[package]
name = "rules"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "rules"
path = "src/lib.rs"

[dependencies]
libc = "0.2.148"
libcc2rs = { version = "0.1.0", path = "../libcc2rs" }
nix = { version = "0.30", features = ["socket", "net", "fs", "poll", "time", "user", "dir", "term", "event", "hostname"] }
jiff = "0.2"
xattr = "1"
