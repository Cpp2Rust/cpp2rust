# Clang treats a discarded-value use as an odr-use, so [=] captures the variable
# and the C++ program itself fails its asserts. Clang implements CWG2083 only
# partially: https://github.com/llvm/llvm-project/issues/127086
config.excludes = list(config.excludes) + ["p5.3-discarded-value-in-lambda.cpp"]
