name: "Run tests"

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}
    name: Run Tests (${{ matrix.os }}, ${{ matrix.build_type }})

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 23

      - name: Configure
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DLIT_FLAGS="-v" \
                -GNinja ..

      - name: Build
        run: ninja
        working-directory: build

      - name: Dump rule keys (macOS)
        if: runner.os == 'macOS'
        run: |
          cat rules/string/ir_src.json rules/vector/ir_src.json rules/map/ir_src.json
          for t in char_printing find operator_traits; do
            flags=""
            if [ "$t" = operator_traits ]; then flags="-cxxflags=-std=c++20"; fi
            ./cpp2rust/cpp2rust -file ../tests/unit/$t.cpp -model unsafe -o /tmp/$t.rs -verbose $flags 2>&1 || true
          done
        working-directory: build

      - name: Run unit tests
        if: false
        run: ninja check
        working-directory: build
